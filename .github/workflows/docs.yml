name: Deploy pdoc to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install pdoc
          pip install -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env <<EOF
          APP_NAME="NP-backend-example"
          ENVIRONMENT="dev"
          DATABASE_URL="postgresql+asyncpg://postgres:password@localhost:5432/np_db"
          SECRET_KEY="change-me-later"
          ALGORITHM="HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          MAIL_SERVER="smtp.gmail.com"
          MAIL_PORT=587
          MAIL_USERNAME="your-email@gmail.com"
          MAIL_PASSWORD="your-app-specific-password"
          MAIL_FROM="noreply@example.com"
          MAIL_FROM_NAME="NP Backend"
          MAIL_TLS=true
          MAIL_SSL=false
          LOG_LEVEL="INFO"
          LOKI_URL=""
          LOKI_USER=""
          LOKI_PASSWORD=""
          EOF

      - name: Build documentation
        run: pdoc -o ./gh-pages-docs ./app

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./gh-pages-docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
