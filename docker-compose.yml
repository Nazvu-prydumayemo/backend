version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: np_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - np_network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    container_name: np_loki
    user: root
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - np_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: np_grafana
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - np_network
    restart: unless-stopped

  backend:
    build: .
    container_name: np_backend
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME}
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_TLS: ${MAIL_TLS}
      MAIL_SSL: ${MAIL_SSL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - np_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: np_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - grafana
    networks:
      - np_network
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  grafana_data:

networks:
  np_network:
    driver: bridge
