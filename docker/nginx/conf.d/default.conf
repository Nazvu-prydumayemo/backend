upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name 0pcode.tech;
    return 301 https://0pcode.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 0pcode.tech;

    client_max_body_size 20M;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_client_certificate /etc/nginx/certs/cloudflare.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    location /api/v1/status {
        limit_req zone=health_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    location /api/v1/user/ {
        limit_req zone=user_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    location /api/v1/courts/ {
        limit_req zone=court_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=general_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
    }

    location / {
        limit_req zone=general_limit burst=15 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend;
    }

    error_page 429 @rate_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"detail":"Rate limit exceeded"}';
    }
}
